name: Build Syria Live APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --project-name syria_live --platforms=android .

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          text = text.replace(
              "minSdkVersion flutter.minSdkVersion",
              "minSdkVersion 23"
          )

          text = text.replace(
              "minSdkVersion 21",
              "minSdkVersion 23"
          )

          if 'ndkVersion "25.1.8937393"' not in text:
              text = text.replace(
                  "android {",
                  'android {\n    ndkVersion "25.1.8937393"',
                  1
              )

          p.write_text(text)
          PY

      - name: Prepare Syria Live HTML
        run: |
          mkdir -p assets

          if [ -f index.html ]; then
            cp index.html assets/index.html
          else
            echo "ERROR: index.html not found!"
            exit 1
          fi

      - name: Create Correct Pubspec
        run: |
          cat > pubspec.yaml <<'EOF'
          name: syria_live
          description: Syria Live | سوريا لايف
          publish_to: "none"

          version: 1.0.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter

            cupertino_icons: ^1.0.8

            firebase_core: ^3.6.0
            firebase_auth: ^5.3.1
            cloud_firestore: ^5.4.4

            agora_rtc_engine: ^6.3.2

            rive: ^0.13.13
            lottie: ^3.1.2
            webview_flutter: ^4.8.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true

            assets:
              - assets/index.html
          EOF

          echo "===== pubspec.yaml ====="
          cat pubspec.yaml

          flutter pub get

      - name: Create Syria Live App
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const SyriaLiveApp());
          }

          class SyriaLiveApp extends StatelessWidget {
            const SyriaLiveApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'سوريا لايف',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF8A2BE2),
                    brightness: Brightness.dark,
                  ),
                ),
                home: const SyriaLiveHome(),
              );
            }
          }

          class SyriaLiveHome extends StatefulWidget {
            const SyriaLiveHome({super.key});

            @override
            State<SyriaLiveHome> createState() => _SyriaLiveHomeState();
          }

          class _SyriaLiveHomeState extends State<SyriaLiveHome> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF0A0A0A))
                ..loadFlutterAsset('assets/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0A0A0A),
                body: SafeArea(
                  child: WebViewWidget(
                    controller: controller,
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Check APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Syria-Live-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
