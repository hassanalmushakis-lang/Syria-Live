name: Build Syria Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          if [ ! -d "lib" ]; then
            rm -rf /tmp/syria_flutter

            flutter create \
              --org com.syrialive \
              --platforms android,ios \
              /tmp/syria_flutter

            cp -R /tmp/syria_flutter/. .
          fi

      - name: Create Syria Live app
        shell: bash
        run: |
          set -e
          mkdir -p lib

          cat > lib/main.dart <<'DART'
import 'package:flutter/material.dart';

void main() {
  runApp(const SyriaLiveApp());
}

const green = Color(0xFF00A651);
const black = Color(0xFF080808);

class SyriaLiveApp extends StatelessWidget {
  const SyriaLiveApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'سوريا لايف',
      theme: ThemeData(
        brightness: Brightness.dark,
        scaffoldBackgroundColor: black,
        colorScheme: ColorScheme.fromSeed(
          seedColor: green,
