name: Setup Syria Live Flutter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Create Flutter project
        run: |
          rm -rf /tmp/syria_flutter

          flutter create \
            --org com.syrialive \
            --platforms=android,ios \
            /tmp/syria_flutter

          cp -r /tmp/syria_flutter/. .

          rm -f index.html

      - name: Save Flutter project to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Create Flutter project structure"
            git push
          fi
