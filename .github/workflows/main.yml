name: Build Syria Live APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Create Flutter project
        run: |
          rm -f pubspec.yaml
          flutter create --org com.syrialive --platforms=android,ios .

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Syria-Live-APK
          path: build/app/outputs/flutter-apk/app-release.apk
