name: Build Syria Live APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --project-name syria_live .

      - name: Prepare Syria Live HTML
        run: |
          mkdir -p assets

          if [ -f index.html ]; then
            cp index.html assets/index.html
          else
            echo "ERROR: index.html not found!"
            exit 1
          fi

      - name: Add WebView
        run: |
          flutter pub add webview_flutter

      - name: Configure assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          text = p.read_text()

          if "  assets:" not in text:
              text = text.replace(
                  "flutter:\n",
                  "flutter:\n  assets:\n    - assets/index.html\n"
              )

          p.write_text(text)
          PY

          flutter pub get

      - name: Create Syria Live App
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const SyriaLiveApp());
          }

          class SyriaLiveApp extends StatelessWidget {
            const SyriaLiveApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'سوريا لايف',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF8A2BE2),
                    brightness: Brightness.dark,
                  ),
                ),
                home: const SyriaLiveHome(),
              );
            }
          }

          class SyriaLiveHome extends StatefulWidget {
            const SyriaLiveHome({super.key});

            @override
            State<SyriaLiveHome> createState() => _SyriaLiveHomeState();
          }

          class _SyriaLiveHomeState extends State<SyriaLiveHome> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF0A0A0A))
                ..loadFlutterAsset('assets/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0A0A0A),
                body: SafeArea(
                  child: WebViewWidget(
                    controller: controller,
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Check APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Syria-Live-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
