name: Build Syria Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: إنشاء مشروع Flutter
        run: |
          if [ ! -f pubspec.yaml ] || [ ! -d lib ]; then
            rm -rf /tmp/syria_flutter

            flutter create \
              --org com.syrialive \
              --platforms=android,ios \
              /tmp/syria_flutter

            cp -r /tmp/syria_flutter/. .
          fi

      - name: إنشاء واجهة سوريا لايف
        run: |
          mkdir -p lib

          cat > lib/main.dart <<'DART'
import 'package:flutter/material.dart';

void main() {
  runApp(const SyriaLiveApp());
}

const green = Color(0xFF00A651);
const black = Color(0xFF080808);
const red = Color(0xFFFF0000);

class SyriaLiveApp extends StatelessWidget {
  const SyriaLiveApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'سوريا لايف',
      theme: ThemeData(
        brightness: Brightness.dark,
        scaffoldBackgroundColor: black,
        colorScheme: ColorScheme.fromSeed(
          seedColor: green,
          brightness: Brightness.dark,
        ),
      ),
      home: const HomePage(),
    );
  }
}

class HomePage extends StatefulWidget {
  const HomePage({super.key});

  @override
  State<HomePage> createState() => _HomePageState();
}

class _HomePageState extends State<HomePage> {
  int index = 0;

  final pages = const [
    HomeContent(),
    RoomsPage(),
    LivePage(),
    GiftsPage(),
    ProfilePage(),
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: pages[index],
      bottomNavigationBar: NavigationBar(
        backgroundColor: const Color(0xFF111111),
        selectedIndex: index,
        indicatorColor: green.withOpacity(.25),
        onDestinationSelected: (value) {
          setState(() => index = value);
        },
        destinations: const [
          NavigationDestination(
            icon: Icon(Icons.home_outlined),
            selectedIcon: Icon(Icons.home),
            label: 'الرئيسية',
          ),
          NavigationDestination(
            icon: Icon(Icons.mic_none),
            selectedIcon: Icon(Icons.mic),
            label: 'الغرف',
          ),
          NavigationDestination(
            icon: Icon(Icons.live_tv),
            selectedIcon: Icon(Icons.live_tv),
            label: 'مباشر',
          ),
          NavigationDestination(
            icon: Icon(Icons.card_giftcard),
            selectedIcon: Icon(Icons.card_giftcard),
            label: 'الهدايا',
          ),
          NavigationDestination(
            icon: Icon(Icons.person_outline),
            selectedIcon: Icon(Icons.person),
            label: 'حسابي',
          ),
        ],
      ),
    );
  }
}

