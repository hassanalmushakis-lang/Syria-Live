class VoiceRoomPage extends StatelessWidget {
  final String roomName;

  const VoiceRoomPage({
    super.key,
    required this.roomName,
  });

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: Text(roomName),
        backgroundColor: black,
      ),
      body: Column(
        children: [
          const SizedBox(height: 20),
          const Text(
            '🇸🇾 سوريا لايف',
            style: TextStyle(
              fontSize: 22,
              fontWeight: FontWeight.bold,
            ),
          ),
          const SizedBox(height: 25),
          Expanded(
            child: GridView.builder(
              padding: const EdgeInsets.all(20),
              itemCount: 8,
              gridDelegate:
                  const SliverGridDelegateWithFixedCrossAxisCount(
                crossAxisCount: 2,
                mainAxisSpacing: 20,
                crossAxisSpacing: 20,
              ),
              itemBuilder: (_, i) {
                return Column(
                  children: [
                    CircleAvatar(
                      radius: 38,
                      backgroundColor:
                          i == 0 ? green : const Color(0xFF222222),
                      child: Icon(
                        i == 0 ? Icons.mic : Icons.person,
                        size: 32,
                      ),
                    ),
                    const SizedBox(height: 8),
                    Text(i == 0 ? 'المضيف' : 'مقعد ${i + 1}'),
                  ],
                );
              },
            ),
          ),
          Padding(
            padding: const EdgeInsets.all(16),
            child: Row(
              mainAxisAlignment: MainAxisAlignment.spaceEvenly,
              children: [
                _button(Icons.mic, 'المايك'),
                _button(Icons.card_giftcard, 'هدية'),
                _button(Icons.chat, 'الدردشة'),
              ],
            ),
          ),
        ],
      ),
    );
  }

  Widget _button(IconData icon, String text) {
    return Column(
      children: [
        CircleAvatar(
          radius: 27,
          backgroundColor: green,
          child: Icon(icon),
        ),
        const SizedBox(height: 5),
        Text(text),
      ],
    );
  }
}

