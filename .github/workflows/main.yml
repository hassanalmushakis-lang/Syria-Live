class RoomCard extends StatelessWidget {
  final String name;
  final int users;

  const RoomCard({
    super.key,
    required this.name,
    required this.users,
  });

  @override
  Widget build(BuildContext context) {
    return Container(
      decoration: BoxDecoration(
        color: const Color(0xFF151515),
        borderRadius: BorderRadius.circular(18),
        border: Border.all(
          color: const Color(0xFF00A651),
          width: 1,
        ),
      ),
      child: Padding(
        padding: const EdgeInsets.all(12),
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            const CircleAvatar(
              radius: 34,
              backgroundColor: Color(0xFF00A651),
              child: Icon(
                Icons.mic,
                size: 35,
                color: Colors.white,
              ),
            ),
            const SizedBox(height: 12),
            Text(
              name,
              textAlign: TextAlign.center,
              style: const TextStyle(
                fontWeight: FontWeight.bold,
                fontSize: 16,
              ),
            ),
            const SizedBox(height: 7),
            Text(
              '$users / 8 مستمعين',
              style: const TextStyle(
                color: Colors.white70,
              ),
            ),
            const SizedBox(height: 10),
            Container(
              padding: const EdgeInsets.symmetric(
                horizontal: 12,
                vertical: 6,
              ),
              decoration: BoxDecoration(
                color: const Color(0xFF00A651),
                borderRadius: BorderRadius.circular(20),
              ),
              child: const Text(
                'دخول',
                style: TextStyle(
                  fontWeight: FontWeight.bold,
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }
}

class RoomsPage extends StatelessWidget {
  const RoomsPage({super.key});

  @override
  Widget build(BuildContext context) {
    return SafeArea(
      child: ListView(
        padding: const EdgeInsets.all(16),
        children: [
          const Text(
            '🎙️ الغرف الصوتية',
            style: TextStyle(
              fontSize: 25,
              fontWeight: FontWeight.bold,
            ),
          ),
          const SizedBox(height: 20),
          for (int i = 1; i <= 8; i++)
            Card(
              color: const Color(0xFF151515),
              child: ListTile(
                leading: const CircleAvatar(
                  backgroundColor: Color(0xFF00A651),
                  child: Icon(Icons.mic),
                ),
                title: Text('غرفة سوريا $i'),
                subtitle: const Text('8 مقاعد صوتية'),
                trailing: const Icon(Icons.arrow_back_ios),
              ),
            ),
        ],
      ),
    );
  }
}

class GiftsPage extends StatelessWidget {
  const GiftsPage({super.key});

  final List<Map<String, dynamic>> gifts = const [
    {'name': 'وردة', 'price': 10, 'icon': '🌹'},
    {'name': 'شاورما', 'price': 50, 'icon': '🌯'},
    {'name': 'أرجيلة', 'price': 200, 'icon': '💨'},
    {'name': 'علم سوريا', 'price': 500, 'icon': '🇸🇾'},
    {'name': 'سيارة', 'price': 1000, 'icon': '🚗'},
    {'name': 'ياسمين', 'price': 5000, 'icon': '🌼'},
    {'name': 'يخت', 'price': 20000, 'icon': '🛥️'},
    {'name': 'قصر', 'price': 50000, 'icon': '🏰'},
  ];

  @override
  Widget build(BuildContext context) {
    return SafeArea(
      child: GridView.builder(
        padding: const EdgeInsets.all(16),
        itemCount: gifts.length,
        gridDelegate:
            const SliverGridDelegateWithFixedCrossAxisCount(
          crossAxisCount: 2,
          crossAxisSpacing: 12,
          mainAxisSpacing: 12,
        ),
        itemBuilder: (context, index) {
          final gift = gifts[index];

          return Container(
            decoration: BoxDecoration(
              color: const Color(0xFF151515),
              borderRadius: BorderRadius.circular(18),
              border: Border.all(
                color: const Color(0xFF00A651),
              ),
            ),
            child: Column(
              mainAxisAlignment: MainAxisAlignment.center,
              children: [
                Text(
                  gift['icon'],
                  style: const TextStyle(fontSize: 45),
                ),
                const SizedBox(height: 8),
                Text(
                  gift['name'],
                  style: const TextStyle(
                    fontSize: 18,
                    fontWeight: FontWeight.bold,
                  ),
                ),
                const SizedBox(height: 5),
                Text(
                  '🪙 ${gift['price']} ليرة',
                  style: const TextStyle(
                    color: Color(0xFF00A651),
                    fontWeight: FontWeight.bold,
                  ),
                ),
              ],
            ),
          );
        },
      ),
    );
  }
}

