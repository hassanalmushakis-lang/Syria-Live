name: Build Syria Live APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Create Flutter project
        run: |
          rm -rf /tmp/syria_flutter
          flutter create --org com.syrialive /tmp/syria_flutter
          cp -r /tmp/syria_flutter/. .
          rm -f index.html

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Syria-Live-APK
          path: build/app/outputs/flutter-apk/app-release.apk
