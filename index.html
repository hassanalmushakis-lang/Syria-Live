<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سوريا لايف 🇸🇾</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07111f, #102b46, #07111f);
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 30px auto 15px;
      border-radius: 50%;
      background: linear-gradient(145deg, #d4af37, #fff1a8, #a67c00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 0 30px rgba(255, 215, 0, .35);
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #c8d5e3;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 22px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    #googleLogin {
      background: white;
      color: #222;
    }

    #logoutBtn {
      background: #b42318;
      color: white;
    }

    #enterBtn {
      background: linear-gradient(135deg, #d4af37, #f4d66d);
      color: #111;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .user-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .user-photo {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 10px;
      object-fit: cover;
      border: 3px solid #d4af37;
    }

    .hidden {
      display: none !important;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      min-height: 24px;
      color: #ffd86b;
      line-height: 1.6;
    }

    .room {
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(0,0,0,.2);
      text-align: center;
    }

    .mic-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .mic {
      aspect-ratio: 1;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 1px solid rgba(255,255,255,.1);
    }

    .footer {
      text-align: center;
      color: #8798aa;
      margin-top: 25px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🇸🇾</div>

    <h1>سوريا لايف</h1>
    <div class="subtitle">دردشة صوتية سورية</div>

    <!-- LOGIN -->
    <div id="loginCard" class="card">

      <h2 style="text-align:center;">تسجيل الدخول</h2>

      <p style="text-align:center;color:#c8d5e3;">
        سجّل الدخول باستخدام حساب Google
      </p>

      <button id="googleLogin">
        🔵 تسجيل الدخول باستخدام Google
      </button>

      <div id="loginStatus" class="status"></div>

    </div>

    <!-- HOME -->
    <div id="homeCard" class="card hidden">

      <div class="user-box">

        <img
          id="userPhoto"
          class="user-photo"
          src=""
          alt="صورة المستخدم"
        >

        <h2 id="userName">مرحباً</h2>

        <div id="userEmail" style="color:#b9c7d5;"></div>

      </div>

      <button id="enterBtn">
        🎙️ دخول الدردشة الصوتية
      </button>

      <button id="logoutBtn">
        تسجيل الخروج
      </button>

      <div id="homeStatus" class="status"></div>

    </div>

    <!-- ROOM -->
    <div id="roomCard" class="card hidden">

      <div class="room">

        <h2>🎙️ الغرفة الصوتية</h2>

        <p style="color:#c8d5e3;">
          سوريا لايف 🇸🇾
        </p>

        <div class="mic-grid">

          <div class="mic">🎤</div>
          <div class="mic">🎤</div>
          <div class="mic">🎤</div>
          <div class="mic">🎤</div>

          <div class="mic">🎤</div>
          <div class="mic">🎤</div>
          <div class="mic">🎤</div>
          <div class="mic">🎤</div>

        </div>

      </div>

    </div>

    <div class="footer">
      سوريا لايف 🇸🇾 — دردشة صوتية سورية
    </div>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      browserPopupRedirectResolver,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC_GWsU8ZqLjfYPVUJHlTEt0UW_QIBzKCM",
      authDomain: "syria-live.firebaseapp.com",
      projectId: "syria-live",
      storageBucket: "syria-live.firebasestorage.app",
      messagingSenderId: "115020553046",
      appId: "1:115020553046:web:aab4092300a793162014f7",
      measurementId: "G-BZ5TDJMCW2"
    };


    // Start Firebase
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });


    // Elements
    const loginCard = document.getElementById("loginCard");
    const homeCard = document.getElementById("homeCard");
    const roomCard = document.getElementById("roomCard");

    const googleLogin = document.getElementById("googleLogin");
    const logoutBtn = document.getElementById("logoutBtn");
    const enterBtn = document.getElementById("enterBtn");

    const loginStatus = document.getElementById("loginStatus");
    const homeStatus = document.getElementById("homeStatus");

    const userPhoto = document.getElementById("userPhoto");
    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");


    // Google Login
    googleLogin.addEventListener("click", async () => {

      loginStatus.textContent = "جاري فتح تسجيل الدخول بواسطة Google...";
      googleLogin.disabled = true;

      try {

        const result = await signInWithPopup(
          auth,
          provider,
          browserPopupRedirectResolver
        );

        const user = result.user;

        loginStatus.textContent =
          "تم تسجيل الدخول بنجاح.";

        console.log("Google login successful:", user);

      } catch (error) {

        console.error("Firebase Auth Error:", error);

        googleLogin.disabled = false;

        if (error.code === "auth/popup-closed-by-user") {

          loginStatus.textContent =
            "تم إغلاق نافذة Google قبل إكمال تسجيل الدخول.";

        } else if (error.code === "auth/popup-blocked") {

          loginStatus.textContent =
            "المتصفح منع نافذة Google. اسمح بالنوافذ المنبثقة.";

        } else if (error.code === "auth/unauthorized-domain") {

          loginStatus.textContent =
            "هذا النطاق غير مصرح به في Firebase Authentication.";

        } else if (error.code === "auth/operation-not-allowed") {

          loginStatus.textContent =
            "تسجيل الدخول بواسطة Google غير مفعّل في Firebase.";

        } else if (error.code === "auth/invalid-api-key") {

          loginStatus.textContent =
            "مفتاح Firebase API غير صالح.";

        } else {

          loginStatus.textContent =
            "خطأ Google: " +
            (error.code || error.message);

        }

      }

    });


    // Logout
    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

        roomCard.classList.add("hidden");

      } catch (error) {

        console.error(error);

        homeStatus.textContent =
          "حدث خطأ أثناء تسجيل الخروج.";

      }

    });


    // Enter room
    enterBtn.addEventListener("click", () => {

      roomCard.classList.remove("hidden");

      roomCard.scrollIntoView({
        behavior: "smooth"
      });

    });


    // Auth state
    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginCard.classList.add("hidden");

        homeCard.classList.remove("hidden");

        userName.textContent =
          user.displayName || "مستخدم سوريا لايف";

        userEmail.textContent =
          user.email || "";

        if (user.photoURL) {

          userPhoto.src = user.photoURL;

        } else {

          userPhoto.src =
            "https://ui-avatars.com/api/?name=" +
            encodeURIComponent(
              user.displayName || "Syria Live"
            );

        }

      } else {

        loginCard.classList.remove("hidden");

        homeCard.classList.add("hidden");

        roomCard.classList.add("hidden");

      }

    });

  </script>

</body>
</html>
