<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوريا لايف</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  background:#0d1117;
  color:white;
  min-height:100vh;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#25384d,#0d1117 60%);
}

.loginBox{
  width:100%;
  max-width:430px;
  background:#151c25;
  border:1px solid #2b3948;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 20px 60px #0008;
}

.logo{
  width:90px;
  height:90px;
  margin:0 auto 15px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#111,#304a60);
  border:3px solid #d7b45a;
  font-size:34px;
}

.loginTitle{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:8px;
}

.loginSub{
  text-align:center;
  color:#9ca9b8;
  margin-bottom:25px;
}

.phoneRow{
  display:flex;
  gap:8px;
}

.country{
  width:105px;
  background:#202b37;
  color:white;
  border:1px solid #3a4857;
  border-radius:12px;
  padding:14px 8px;
}

.input{
  width:100%;
  padding:14px;
  background:#202b37;
  color:white;
  border:1px solid #3a4857;
  border-radius:12px;
  outline:none;
  margin-bottom:12px;
}

.input:focus{
  border-color:#d7b45a;
}

.primary{
  width:100%;
  padding:15px;
  border-radius:13px;
  background:linear-gradient(135deg,#d9bd68,#9f7930);
  color:#111;
  font-weight:bold;
  font-size:16px;
  margin-top:5px;
}

.google{
  width:100%;
  padding:15px;
  border-radius:13px;
  background:white;
  color:#222;
  font-weight:bold;
  font-size:16px;
  margin-top:12px;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:#778493;
  margin:20px 0;
}

.divider span{
  flex:1;
  height:1px;
  background:#34404d;
}

#recaptcha-container{
  margin:12px 0;
}

/* APP */
#app{
  min-height:100vh;
  padding-bottom:75px;
}

.topbar{
  height:65px;
  background:#151c25;
  border-bottom:1px solid #2b3948;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  font-size:21px;
  font-weight:bold;
  color:#e1c46e;
}

.coins{
  background:#202b37;
  border:1px solid #384858;
  padding:8px 12px;
  border-radius:20px;
}

.page{
  padding:18px;
}

.welcome{
  background:linear-gradient(135deg,#172636,#111820);
  border:1px solid #2b3948;
  padding:20px;
  border-radius:20px;
  margin-bottom:18px;
}

.welcome h2{
  margin-bottom:7px;
}

.muted{
  color:#98a5b3;
}

.sectionTitle{
  margin:20px 0 12px;
  font-size:20px;
}

.rooms{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
}

.roomCard{
  background:#151c25;
  border:1px solid #2c3947;
  border-radius:18px;
  padding:16px;
}

.roomIcon{
  font-size:32px;
  margin-bottom:8px;
}

.roomName{
  font-weight:bold;
  margin-bottom:8px;
}

.roomInfo{
  color:#8f9dab;
  font-size:13px;
  margin-bottom:12px;
}

.roomButton{
  width:100%;
  padding:11px;
  border-radius:10px;
  background:#263746;
  color:white;
}

/* PROFILE */
.profileCard{
  background:#151c25;
  border:1px solid #2c3947;
  border-radius:20px;
  padding:22px;
  text-align:center;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#263746;
  display:flex;
  justify-content:center;
  align-items:center;
  margin:0 auto 12px;
  font-size:32px;
}

.profileLine{
  margin:10px 0;
  color:#a7b2bf;
}

/* ROOM */
#roomPage{
  min-height:100vh;
  background:#0c1117;
}

.roomHeader{
  height:65px;
  background:#151c25;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
}

.back{
  background:#263746;
  color:white;
  padding:9px 13px;
  border-radius:10px;
}

.adminPanel{
  background:#151c25;
  margin:14px;
  padding:15px;
  border-radius:18px;
  border:1px solid #2c3947;
}

.adminPanel select{
  margin-top:10px;
  width:100%;
  padding:12px;
  border-radius:10px;
  background:#202b37;
  color:white;
  border:1px solid #3a4857;
}

.seats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  padding:18px;
}

.seat{
  aspect-ratio:1;
  border-radius:50%;
  background:#202b37;
  border:2px solid #394958;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:13px;
}

.seat.active{
  border-color:#d7b45a;
  background:#473b22;
}

.mic{
  font-size:25px;
  margin-bottom:4px;
}

.chat{
  margin:14px;
  background:#151c25;
  border-radius:18px;
  border:1px solid #2c3947;
  padding:14px;
}

.messages{
  min-height:160px;
  max-height:260px;
  overflow:auto;
  margin-bottom:10px;
}

.message{
  padding:7px 0;
  color:#d4dbe2;
}

.chatRow{
  display:flex;
  gap:8px;
}

.chatRow input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid #3a4857;
  background:#202b37;
  color:white;
}

.chatRow button{
  padding:12px 16px;
  border-radius:10px;
  background:#d7b45a;
}

/* NAV */
.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:#151c25;
  border-top:1px solid #2b3948;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.navBtn{
  background:none;
  color:#8f9dab;
  text-align:center;
  font-size:12px;
}

.navBtn.active{
  color:#e1c46e;
}

.navIcon{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

@media(max-width:400px){
  .seats{
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:12px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage">

  <div class="loginBox">

    <div class="logo">🇸🇾</div>

    <div class="loginTitle">سوريا لايف</div>

    <div class="loginSub">
      دردشة صوتية سورية
    </div>

    <div id="phoneLogin">

      <div class="phoneRow">

        <select id="countryCode" class="country">
          <option value="+963">🇸🇾 +963</option>
          <option value="+44">🇬🇧 +44</option>
          <option value="+90">🇹🇷 +90</option>
          <option value="+962">🇯🇴 +962</option>
          <option value="+961">🇱🇧 +961</option>
          <option value="+964">🇮🇶 +964</option>
        </select>

        <input
          id="phoneInput"
          class="input"
          type="tel"
          placeholder="رقم الهاتف"
          autocomplete="tel"
        >

      </div>

      <div id="recaptcha-container"></div>

      <button
        class="primary"
        onclick="sendOTP()">
        متابعة برقم الهاتف
      </button>

    </div>

    <div id="otpBox" class="hidden">

      <p class="muted" style="margin-bottom:12px">
        تم إرسال رمز التحقق إلى هاتفك
      </p>

      <input
        id="otpInput"
        class="input"
        type="number"
        inputmode="numeric"
        placeholder="أدخل رمز التحقق"
      >

      <button
        class="primary"
        onclick="verifyOTP()">
        تأكيد الرمز والدخول
      </button>

      <button
        onclick="backToPhone()"
        style="width:100%;margin-top:10px;padding:12px;border-radius:10px;background:#263746;color:white">
        تغيير الرقم
      </button>

    </div>

    <div class="divider">
      <span></span>
      أو
      <span></span>
    </div>

    <button
      class="google"
      onclick="googleLogin()">
      🔵 الدخول باستخدام Google
    </button>

  </div>

</section>


<!-- APP -->
<section id="app" class="hidden">

  <div class="topbar">

    <div class="brand">
      سوريا لايف
    </div>

    <div class="coins">
      🪙 <span id="coins">1000</span>
    </div>

  </div>


  <!-- HOME -->
  <main id="homePage" class="page">

    <div class="welcome">
      <h2>
        أهلاً <span id="welcomeName">مستخدم</span> 👋
      </h2>

      <div class="muted">
        مرحباً بك في سوريا لايف
      </div>
    </div>

    <h3 class="sectionTitle">
      🔴 الغرف المباشرة
    </h3>

    <div id="rooms" class="rooms"></div>

  </main>


  <!-- PROFILE -->
  <main id="profilePage" class="page hidden">

    <div class="profileCard">

      <div class="avatar">
        👤
      </div>

      <h2 id="profileName">
        مستخدم
      </h2>

      <div class="profileLine">
        ID: <span id="profileId">-</span>
      </div>

      <div class="profileLine">
        📱 <span id="profilePhone">-</span>
      </div>

      <div class="profileLine">
        🪙 الرصيد: <span id="profileCoins">1000</span>
      </div>

      <button
        class="primary"
        onclick="logout()"
        style="margin-top:20px">
        تسجيل الخروج
      </button>

    </div>

  </main>


  <!-- GIFTS -->
  <main id="giftsPage" class="page hidden">

    <h2>🎁 الهدايا</h2>

    <div class="rooms" style="margin-top:20px">

      <div class="roomCard">
        🌹 وردة
        <br><br>
        <button class="roomButton" onclick="sendGift(10)">
          10 🪙
        </button>
      </div>

      <div class="roomCard">
        💎 ألماسة
        <br><br>
        <button class="roomButton" onclick="sendGift(100)">
          100 🪙
        </button>
      </div>

      <div class="roomCard">
        👑 تاج
        <br><br>
        <button class="roomButton" onclick="sendGift(500)">
          500 🪙
        </button>
      </div>

    </div>

  </main>


  <!-- NAV -->
  <nav class="bottomNav">

    <button
      class="navBtn active"
      onclick="showPage('homePage',this)">
      <span class="navIcon">🏠</span>
      الرئيسية
    </button>

    <button
      class="navBtn"
      onclick="showPage('giftsPage',this)">
      <span class="navIcon">🎁</span>
      الهدايا
    </button>

    <button
      class="navBtn"
      onclick="showPage('profilePage',this)">
      <span class="navIcon">👤</span>
      حسابي
    </button>

  </nav>

</section>


<!-- ROOM -->
<section id="roomPage" class="hidden">

  <div class="roomHeader">

    <button
      class="back"
      onclick="leaveRoom()">
      ← خروج
    </button>

    <strong id="roomTitle">
      الغرفة
    </strong>

    <span>🔴 مباشر</span>

  </div>


  <div class="adminPanel">

    <strong>
      ⚙️ إدارة الغرفة
    </strong>

    <select
      id="seatCount"
      onchange="changeSeats()">

      <option value="8">8 مايكات</option>
      <option value="10">10 مايكات</option>
      <option value="15">15 مايكات</option>
      <option value="20">20 مايكات</option>

    </select>

  </div>


  <div id="seats" class="seats"></div>


  <div class="chat">

    <h3 style="margin-bottom:12px">
      💬 دردشة الغرفة
    </h3>

    <div id="messages" class="messages"></div>

    <div class="chatRow">

      <input
        id="messageInput"
        placeholder="اكتب رسالة...">

      <button onclick="sendMessage()">
        إرسال
      </button>

    </div>

  </div>

</section>


<!-- FIREBASE -->
<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyC_GWsU8ZqLjfYPVUJHlTe0UW_QIBzKCM",
  authDomain: "syria-live.firebaseapp.com",
  projectId: "syria-live",
  storageBucket: "syria-live.firebasestorage.app",
  messagingSenderId: "115020553046",
  appId: "1:115020553046:web:aab4092300a793162014f7",
  measurementId: "G-BZ5TDJMCW2"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

let confirmationResult = null;
let recaptchaVerifier = null;


/* RECAPTCHA */

function setupRecaptcha(){

  if(recaptchaVerifier) return;

  recaptchaVerifier =
    new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {
        size:"normal"
      }
    );

}


/* PHONE */

window.sendOTP = async function(){

  const code =
    document.getElementById("countryCode").value;

  let phone =
    document.getElementById("phoneInput").value.trim();

  phone = phone.replace(/\D/g,"");

  if(!phone){

    alert("أدخل رقم الهاتف");

    return;
  }

  if(phone.startsWith("0")){
    phone = phone.substring(1);
  }

  const fullPhone = code + phone;

  try{

    setupRecaptcha();

    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        fullPhone,
        recaptchaVerifier
      );

    document
      .getElementById("phoneLogin")
      .classList.add("hidden");

    document
      .getElementById("otpBox")
      .classList.remove("hidden");

    alert("تم إرسال رمز التحقق إلى هاتفك");

  }catch(error){

    console.error(error);

    alert(
      "تعذر إرسال رمز التحقق: " +
      error.message
    );

  }

};


/* VERIFY OTP */

window.verifyOTP = async function(){

  const code =
    document
      .getElementById("otpInput")
      .value.trim();

  if(!code){

    alert("أدخل رمز التحقق");

    return;
  }

  if(!confirmationResult){

    alert("اطلب رمز التحقق أولاً");

    return;
  }

  try{

    await confirmationResult.confirm(code);

  }catch(error){

    console.error(error);

    alert(
      "رمز التحقق غير صحيح أو انتهت صلاحيته"
    );

  }

};


/* GOOGLE */

window.googleLogin = async function(){

  try{

    const provider =
      new GoogleAuthProvider();

    await signInWithRedirect(
      auth,
      provider
    );

  }catch(error){

    console.error(error);

    alert(
      "تعذر تسجيل الدخول باستخدام Google: " +
      error.message
    );

  }

};


/* GOOGLE REDIRECT RESULT */

getRedirectResult(auth)
.then(result => {

  if(result && result.user){

    showAppForUser(result.user);

  }

})
.catch(error => {

  console.error(error);

});


/* AUTH STATE */

onAuthStateChanged(auth,user => {

  if(user){

    showAppForUser(user);

  }

});


/* SHOW APP */

function showAppForUser(user){

  window.currentUser = user;

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("roomPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  const name =
    user.displayName ||
    "مستخدم سوريا";


  document
    .getElementById("welcomeName")
    .textContent = name;


  document
    .getElementById("profileName")
    .textContent = name;


  document
    .getElementById("profileId")
    .textContent =
      user.uid;


  document
    .getElementById("profilePhone")
    .textContent =
      user.phoneNumber ||
      user.email ||
      "-";


  renderRooms();

}


/* LOGOUT */

window.logout = async function(){

  await signOut(auth);

};


/* BACK TO PHONE */

window.backToPhone = function(){

  document
    .getElementById("otpBox")
    .classList.add("hidden");

  document
    .getElementById("phoneLogin")
    .classList.remove("hidden");

};


/* NAVIGATION */

window.showPage = function(pageId,button){

  document
    .querySelectorAll("#app
