<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سوريا لايف 🇸🇾</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,Tahoma,sans-serif;
      background:
        radial-gradient(circle at top,#142b55 0%,#071225 45%,#030914 100%);
      color:#fff;
      min-height:100vh;
    }

    button,input{font-family:inherit}
    button{border:0;cursor:pointer}

    .header{
      position:sticky;
      top:0;
      z-index:50;
      padding:12px;
      background:rgba(3,9,20,.95);
      border-bottom:1px solid rgba(255,215,80,.25);
      backdrop-filter:blur(10px);
    }

    .header-row{
      max-width:900px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .logo{
      font-size:21px;
      font-weight:bold;
      color:#ffd84d;
    }

    .coins{
      background:linear-gradient(135deg,#8c6500,#ffd84d);
      color:#171000;
      padding:8px 12px;
      border-radius:20px;
      font-weight:bold;
    }

    .container{
      width:min(900px,94%);
      margin:18px auto 40px;
    }

    .notice{
      background:rgba(255,215,80,.08);
      border:1px solid rgba(255,215,80,.2);
      color:#ffe889;
      padding:10px 13px;
      border-radius:14px;
      text-align:center;
      font-size:13px;
      margin-bottom:14px;
    }

    .room-card{
      background:rgba(11,25,48,.92);
      border:1px solid rgba(255,215,80,.18);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 15px 50px rgba(0,0,0,.35);
    }

    .room-cover{
      padding:18px;
      background:linear-gradient(
        135deg,
        rgba(13,44,88,.9),
        rgba(9,18,37,.95)
      );
    }

    .room-title{
      font-size:22px;
      font-weight:bold;
      margin-bottom:6px;
    }

    .room-info{
      color:#aebbd0;
      font-size:13px;
    }

    .room-actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:14px;
    }

    .btn{
      padding:10px 14px;
      border-radius:12px;
      color:#fff;
      background:#172a4b;
      border:1px solid rgba(255,255,255,.08);
      font-weight:bold;
    }

    .btn-gold{
      color:#171000;
      background:linear-gradient(135deg,#b98700,#ffe16a);
    }

    .btn-red{background:#6e202a}
    .btn-green{background:#175c45}

    .section{padding:15px}

    .section-title{
      color:#ffd84d;
      font-size:16px;
      font-weight:bold;
      margin-bottom:12px;
    }

    .seats{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
    }

    .seat{
      min-height:92px;
      padding:8px 5px;
      border-radius:14px;
      background:#0d1d37;
      border:1px solid rgba(255,255,255,.07);
      text-align:center;
    }

    .seat.active{
      border-color:#ffd84d;
      box-shadow:0 0 15px rgba(255,216,77,.15);
    }

    .avatar{
      width:42px;
      height:42px;
      margin:0 auto 6px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#214b83,#13223c);
      border:2px solid #36547d;
      font-size:20px;
    }

    .seat-number{
      color:#7185a4;
      font-size:11px;
    }

    .seat-name{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:11px;
      margin-top:3px;
    }

    .mic-status{
      font-size:11px;
      color:#8e9eb6;
      margin-top:4px;
    }

    .chat-box{
      height:260px;
      overflow-y:auto;
      background:#071326;
      border-radius:14px;
      padding:12px;
      border:1px solid rgba(255,255,255,.06);
    }

    .message{
      padding:8px 10px;
      margin-bottom:7px;
      background:#102442;
      border-radius:11px;
      font-size:13px;
    }

    .message strong{color:#ffd84d}

    .chat-input{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .chat-input input{
      flex:1;
      min-width:0;
      background:#09172b;
      color:#fff;
      border:1px solid #263c5d;
      border-radius:12px;
      padding:12px;
      outline:none;
    }

    .gifts{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:8px;
    }

    .gift{
      background:#102442;
      border:1px solid rgba(255,255,255,.07);
      color:#fff;
      border-radius:14px;
      padding:10px 5px;
      text-align:center;
    }

    .gift .emoji{
      font-size:28px;
      display:block;
      margin-bottom:5px;
    }

    .gift .price{
      color:#ffd84d;
      font-size:11px;
      margin-top:4px;
    }

    .target-box{
      background:#09172b;
      padding:13px;
      border-radius:15px;
      border:1px solid rgba(255,255,255,.06);
    }

    .target-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
      font-size:13px;
    }

    .progress{
      height:12px;
      background:#15243a;
      border-radius:20px;
      overflow:hidden;
    }

    .progress-bar{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#a87600,#ffe16a);
      border-radius:20px;
      transition:width .3s;
    }

    .menu-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:9px;
    }

    .menu-btn{
      background:#0d1d37;
      color:#fff;
      border:1px solid rgba(255,255,255,.07);
      border-radius:14px;
      padding:13px 5px;
    }

    .menu-btn .big{
      font-size:23px;
      display:block;
      margin-bottom:5px;
    }

    .profile{
      display:flex;
      align-items:center;
      gap:12px;
      background:#0d1d37;
      padding:12px;
      border-radius:15px;
      margin-bottom:12px;
    }

    .profile-avatar{
      width:55px;
      height:55px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#234e86,#10233e);
      font-size:26px;
      border:2px solid #ffd84d;
    }

    .profile-name{
      font-weight:bold;
      font-size:16px;
    }

    .vip{
      display:inline-block;
      margin-top:4px;
      padding:3px 7px;
      border-radius:8px;
      background:#5b4200;
      color:#ffd84d;
      font-size:10px;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      z-index:100;
      background:rgba(0,0,0,.75);
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .modal.show{display:flex}

    .modal-card{
      width:min(500px,100%);
      max-height:90vh;
      overflow-y:auto;
      background:#0b1930;
      border:1px solid rgba(255,216,77,.25);
      border-radius:20px;
      padding:18px;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
    }

    .modal-title{
      color:#ffd84d;
      font-size:19px;
      font-weight:bold;
    }

    .close{
      width:35px;
      height:35px;
      border-radius:50%;
      background:#172a4b;
      color:#fff;
      font-size:18px;
    }

    .form-input{
      width:100%;
      background:#071326;
      color:#fff;
      border:1px solid #263c5d;
      border-radius:12px;
      padding:12px;
      margin:7px 0 12px;
      outline:none;
    }

    .stat-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    .stat{
      background:#102442;
      border-radius:14px;
      padding:15px;
      text-align:center;
    }

    .stat-number{
      font-size:22px;
      color:#ffd84d;
      font-weight:bold;
    }

    .footer{
      text-align:center;
      color:#5f708c;
      font-size:11px;
      margin-top:25px;
    }

    .toast{
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%) translateY(100px);
      background:#152a49;
      color:#fff;
      border:1px solid rgba(255,216,77,.3);
      padding:12px 18px;
      border-radius:14px;
      z-index:200;
      opacity:0;
      transition:.3s;
      pointer-events:none;
      max-width:90%;
      text-align:center;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    @media(max-width:650px){
      .seats{grid-template-columns:repeat(4,1fr)}
      .gifts{grid-template-columns:repeat(3,1fr)}
      .menu-grid{grid-template-columns:repeat(2,1fr)}
    }

    @media(max-width:420px){
      .seats{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-row">
    <div class="logo">🇸🇾 سوريا لايف</div>
    <div class="coins" id="coinsDisplay">🪙 100,000</div>
  </div>
</header>

  <div class="notice">

  </div>

  <div class="profile">

    <div class="profile-avatar">👤</div>

    <div style="flex:1">
      <div class="profile-name" id="profileName">
