<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوريا لايف</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 92%;
      max-width: 420px;
      background: rgba(255,255,255,.08);
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    h1 {
      margin-bottom: 5px;
      font-size: 32px;
    }

    .subtitle {
      color: #d1d5db;
      margin-bottom: 25px;
    }

    select, input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
    }

    select, input {
      background: white;
      color: #111;
    }

    button {
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.google {
      background: white;
      color: #111;
    }

    button:disabled {
      opacity: .6;
    }

    #otpBox,
    #home {
      display: none;
    }

    #message {
      margin-top: 15px;
      min-height: 24px;
      color: #fde68a;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 5px;
    }

    .home-title {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .logout {
      background: #dc2626;
      margin-top: 25px;
    }

    #recaptcha-container {
      margin-top: 12px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>

<body>

<div class="box" id="login">

  <div class="logo">🇸🇾</div>

  <h1>سوريا لايف</h1>

  <div class="subtitle">
    دردشة صوتية سورية
  </div>

  <select id="country">
    <option value="+963">🇸🇾 +963 سوريا</option>
    <option value="+967">🇾🇪 +967 اليمن</option>
    <option value="+20">🇪🇬 +20 مصر</option>
    <option value="+962">🇯🇴 +962 الأردن</option>
    <option value="+961">🇱🇧 +961 لبنان</option>
    <option value="+964">🇮🇶 +964 العراق</option>
    <option value="+90">🇹🇷 +90 تركيا</option>
    <option value="+44">🇬🇧 +44 بريطانيا</option>
  </select>

  <input
    id="phone"
    type="tel"
    placeholder="رقم الهاتف بدون رمز الدولة"
  >

  <button id="sendBtn">
    📱 متابعة برقم الهاتف
  </button>

  <div id="recaptcha-container"></div>

  <div id="otpBox">

    <input
      id="otp"
      type="number"
      placeholder="أدخل رمز التحقق"
    >

    <button id="verifyBtn">
      تأكيد رمز التحقق
    </button>

  </div>

  <button class="google" id="googleBtn">
    🔵 تسجيل الدخول بواسطة Google
  </button>

  <div id="message"></div>

</div>


<div class="box" id="home">

  <div class="logo">🇸🇾</div>

  <div class="home-title">
    أهلاً بك في سوريا لايف
  </div>

  <p id="userInfo"></p>

  <button>
    🎙️ الغرف الصوتية
  </button>

  <button>
    👥 الأصدقاء
  </button>

  <button>
    🎁 الهدايا
  </button>

  <button>
    🪙 العملات
  </button>

  <button class="logout" id="logoutBtn">
    تسجيل الخروج
  </button>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    GoogleAuthProvider,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


  const firebaseConfig = {
    apiKey: "AIzaSyC_GWsU8ZqLjfYPVUJHlte0UW_QIBzKCM",
    authDomain: "syria-live.firebaseapp.com",
    projectId: "syria-live",
    storageBucket: "syria-live.firebasestorage.app",
    messagingSenderId: "115020553046",
    appId: "1:115020553046:web:aab4092300a793162014f7",
    measurementId: "G-BZ5TDJMCW2"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const loginBox = document.getElementById("login");
  const homeBox = document.getElementById("home");
  const message = document.getElementById("message");

  const sendBtn = document.getElementById("sendBtn");
  const verifyBtn = document.getElementById("verifyBtn");
  const googleBtn = document.getElementById("googleBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const otpBox = document.getElementById("otpBox");

  let confirmationResult = null;
  let recaptchaVerifier = null;


  function showMessage(text) {
    message.textContent = text;
  }


  async function setupRecaptcha() {

    if (recaptchaVerifier) return;

    recaptchaVerifier = new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {
        size: "normal"
      }
    );

    await recaptchaVerifier.render();
  }


  sendBtn.addEventListener("click", async () => {

    try {

      const country = document.getElementById("country").value;
      const phone = document.getElementById("phone").value.trim();

      if (!phone) {
        showMessage("اكتب رقم الهاتف أولاً");
        return;
      }

      const fullPhone = country + phone;

      sendBtn.disabled = true;

      showMessage("جاري إرسال رمز التحقق...");

      await setupRecaptcha();

      confirmationResult =
        await signInWithPhoneNumber(
          auth,
          fullPhone,
          recaptchaVerifier
        );

      otpBox.style.display = "block";

      showMessage("تم إرسال رمز التحقق إلى هاتفك");

      sendBtn.disabled = false;

    } catch (error) {

      console.error(error);

      sendBtn.disabled = false;

      showMessage(
        "حدث خطأ: " +
        (error.code || error.message)
      );

    }

  });


  verifyBtn.addEventListener("click", async () => {

    try {

      const otp =
        document.getElementById("otp").value.trim();

      if (!otp) {
        showMessage("أدخل رمز التحقق");
        return;
      }

      showMessage("جاري التحقق...");

      await confirmationResult.confirm(otp);

    } catch (error) {

      console.error(error);

      showMessage(
        "رمز التحقق غير صحيح أو انتهت صلاحيته"
      );

    }

  });


  googleBtn.addEventListener("click", async () => {

    try {

      const provider = new GoogleAuthProvider();

      await signInWithRedirect(
        auth,
        provider
      );

    } catch (error) {

      console.error(error);

      showMessage(
        "حدث خطأ في تسجيل Google: " +
        (error.code || error.message)
      );

    }

  });


  try {

    await getRedirectResult(auth);

  } catch (error) {

    console.error(error);

  }


  onAuthStateChanged(auth, (user) => {

    if (user) {

      loginBox.style.display = "none";

      homeBox.style.display = "block";

      document.getElementById("userInfo").textContent =
        user.phoneNumber ||
        user.email ||
        "تم تسجيل الدخول بنجاح";

    } else {

      loginBox.style.display = "block";

      homeBox.style.display = "none";

    }

  });


  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

    location.reload();

  });

</script>

</body>
</html>
