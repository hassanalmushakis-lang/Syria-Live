<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سوريا لايف</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 92%;
      max-width: 420px;
      background: rgba(255,255,255,.08);
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 55px;
      margin-bottom: 5px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 32px;
    }

    .subtitle {
      color: #d1d5db;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .google {
      background: white;
      color: #111827;
    }

    .google:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      min-height: 24px;
      color: #fde68a;
      line-height: 1.6;
    }

    #home {
      display: none;
    }

    .home-title {
      font-size: 28px;
      margin-bottom: 15px;
    }

    #userInfo {
      color: #d1d5db;
      word-break: break-word;
    }

    .logout {
      background: #dc2626;
      color: white;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="box" id="login">

    <div class="logo">🇸🇾</div>

    <h1>سوريا لايف</h1>

    <div class="subtitle">
      دردشة صوتية سورية
    </div>

    <button class="google" id="googleBtn">
      🔵 تسجيل الدخول بواسطة Google
    </button>

    <div id="message"></div>

  </div>


  <div class="box" id="home">

    <div class="logo">🇸🇾</div>

    <div class="home-title">
      أهلاً بك في سوريا لايف
    </div>

    <p id="userInfo"></p>

    <button>
      🎙️ الغرف الصوتية
    </button>

    <button>
      👥 الأصدقاء
    </button>

    <button>
      🎁 الهدايا
    </button>

    <button>
      🪙 العملات
    </button>

    <button class="logout" id="logoutBtn">
      تسجيل الخروج
    </button>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyC_GWsU8ZqLjfYPVUJHlTEt0UW_QIBzKCM",
      authDomain: "syria-live.firebaseapp.com",
      projectId: "syria-live",
      storageBucket: "syria-live.firebasestorage.app",
      messagingSenderId: "115020553046",
      appId: "1:115020553046:web:aab4092300a793162014f7",
      measurementId: "G-BZ5TDJMCW2"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });


    const loginBox = document.getElementById("login");
    const homeBox = document.getElementById("home");
    const googleBtn = document.getElementById("googleBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const message = document.getElementById("message");
    const userInfo = document.getElementById("userInfo");


    function showMessage(text) {
      message.textContent = text;
    }


    googleBtn.addEventListener("click", async () => {

      try {

        googleBtn.disabled = true;

        showMessage("جاري فتح تسجيل الدخول بواسطة Google...");

        const result = await signInWithPopup(
          auth,
          provider
        );

        const user = result.user;

        showMessage("تم تسجيل الدخول بنجاح");

        console.log("Google user:", user);

      } catch (error) {

        console.error("Google Login Error:", error);

        let text = "تعذر تسجيل الدخول بواسطة Google.";

        if (error.code === "auth/popup-closed-by-user") {
          text = "تم إغلاق نافذة Google قبل إكمال تسجيل الدخول.";
        }

        else if (error.code === "auth/popup-blocked") {
          text = "المتصفح منع نافذة Google. اسمح بالنوافذ المنبثقة ثم حاول مرة أخرى.";
        }

        else if (error.code === "auth/unauthorized-domain") {
          text = "نطاق الموقع غير مضاف إلى Authorized domains في Firebase.";
        }

        else if (error.code === "auth/operation-not-allowed") {
          text = "تسجيل Google غير مفعّل في Firebase.";
        }

        else if (error.code) {
          text = "خطأ Google: " + error.code;
        }

        showMessage(text);

        googleBtn.disabled = false;
      }

    });


    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginBox.style.display = "none";
        homeBox.style.display = "block";

        userInfo.textContent =
          user.displayName ||
          user.email ||
          "تم تسجيل الدخول بنجاح";

      } else {

        loginBox.style.display = "block";
        homeBox.style.display = "none";

      }

    });


    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

        showMessage("تم تسجيل الخروج");

      } catch (error) {

        console.error(error);

      }

    });

  </script>

</body>
      </html>
